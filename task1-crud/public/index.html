<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StockFlow inventory management dashboard" />
    <title>StockFlow | Product Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" />
            <path d="m4.5 7.5 7.5 4 7.5-4M12 11.5V21" />
          </svg>
        </div>
        <div>
          <p class="eyebrow">Inventory Management</p>
          <h1>StockFlow</h1>
        </div>
        <span class="status-pill"><span></span> Live inventory</span>
      </header>

      <section class="summary-card" aria-label="Inventory summary">
        <div class="summary-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 8h14v11H5zM8 8V5h8v3M9 12h6" />
          </svg>
        </div>
        <div>
          <p>Total products</p>
          <strong id="product-count">0</strong>
          <span>Items currently in your inventory</span>
        </div>
        <div class="summary-decoration" aria-hidden="true"></div>
      </section>

      <section class="content-grid">
        <section class="panel form-panel">
          <div class="panel-heading">
            <span class="section-number">01</span>
            <div>
              <h2>Add New Product</h2>
              <p>Enter the product details below.</p>
            </div>
          </div>

          <form id="product-form" novalidate>
            <input type="hidden" id="item-id" />
            <div class="form-group">
              <label for="name">Product name</label>
              <input id="name" name="name" type="text" placeholder="e.g. Wireless keyboard" maxlength="100" required />
            </div>
            <div class="form-group">
              <label for="price">Price</label>
              <div class="price-field">
                <span aria-hidden="true">₹</span>
                <input id="price" name="price" type="number" placeholder="0.00" min="0" step="0.01" required />
              </div>
            </div>
            <div class="form-actions">
              <button class="primary-button" id="submit-button" type="submit">
                <span>Submit</span>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6" /></svg>
              </button>
              <button class="secondary-button hidden" id="cancel-button" type="button">Cancel</button>
            </div>
          </form>

          <p id="message" class="message" role="status" aria-live="polite"></p>
        </section>

        <section class="panel inventory-panel">
          <div class="panel-heading table-heading">
            <div class="heading-group">
              <span class="section-number">02</span>
              <div>
                <h2>Product Inventory</h2>
                <p>Manage all products in one place.</p>
              </div>
            </div>
            <span class="table-label">All products</span>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Product Name</th>
                  <th>Price</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="product-list"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
